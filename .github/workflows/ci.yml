name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./cmd/ward
      - name: Validate POSIX scripts
        if: runner.os != 'Windows'
        shell: sh
        run: |
          set -eu
          sh -n install.sh uninstall.sh scripts/e2e-codex-permissions.sh
          test_home=$(mktemp -d)
          mkdir -p "$test_home/home"
          if HOME="$test_home/home" CODEX_HOME="$test_home/home/.codex" WARD_INSTALL_DIR="$test_home/outside" ./install.sh --version v1.2.3; then
            echo 'installer accepted a destination outside CODEX_HOME' >&2
            exit 1
          fi
          if HOME="$test_home/home" CODEX_HOME="$test_home/home/.codex" ./install.sh --version 'v1.2.3/../../x'; then
            echo 'installer accepted an invalid version' >&2
            exit 1
          fi
      - name: Validate PowerShell scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          foreach ($path in @('install.ps1', 'uninstall.ps1', 'scripts/e2e-codex-permissions.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $_" }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          $outside = Join-Path $env:RUNNER_TEMP 'ward-outside'
          $rejected = $false
          try {
            & ./install.ps1 -Version v1.2.3 -InstallDir $outside
          } catch {
            if ($_.Exception.Message -match 'remain below CODEX_HOME') { $rejected = $true }
          }
          if (-not $rejected) { throw 'installer accepted a destination outside CODEX_HOME' }

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install PyYAML
      - name: Validate plugin
        run: python scripts/validate-plugin.py

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-build CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            suffix=
            if [[ "$os" == windows ]]; then suffix=.exe; fi
            GOOS="$os" GOARCH="$arch" go build -o "dist/ward-${os}-${arch}${suffix}" ./cmd/ward
          done
